<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTHOR'S HOMEWORK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,700;0,900;1,700;1,900&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ffba38;
            --primary-fixed: #ffdeac;
            --on-primary: #432c00;
            --surface: #16111f;
            --surface-dim: #16111f;
            --surface-container-lowest: #110b1a;
            --surface-container-low: #1f1928;
            --surface-container: #231d2c;
            --surface-container-high: #2e2737;
            --surface-container-highest: #393242;
            --on-surface: #eadef4;
            --on-surface-variant: #ccc4cf;
            --outline: #958e99;
            --outline-variant: #4a454e;
            --tertiary: #b9ccb1;
            --green: #00c853;
            --font-headline: 'Noto Serif', serif;
            --font-body: 'Newsreader', serif;
            --font-label: 'Manrope', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-label);
            color: var(--on-surface);
            background: var(--surface);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* STARFIELD ANIMATION */
        .stars, .stars-md {
            position: absolute;
            top: 0; left: 0;
            border-radius: 50%;
            background: transparent;
            pointer-events: none;
        }

        .stars {
            width: 1px; height: 1px;
            box-shadow: 1425px 308px #fff, 187px 125px #fff, 913px 467px #fff, 1680px 82px #fff, 432px 391px #fff, 1102px 37px #fff, 761px 242px #fff;
            animation: drift 150s linear infinite;
        }

        .stars-md {
            width: 2px; height: 2px;
            box-shadow: 1312px 178px #fff, 456px 445px #fff, 1789px 112px #fff, 623px 323px #fff;
            animation: drift 100s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0); }
            to   { transform: translateY(-600px); }
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 80px 0 60px;
            background: var(--surface-container-lowest);
            position: relative;
            overflow: hidden;
        }

        .header__title {
            font-family: var(--font-headline);
            font-size: clamp(1rem, 8vw, 2.5rem);
            font-weight: 500;
            font-style: bold;
            color: var(--primary);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .header__subtitle {
            font-family: var(--font-headline);
            font-size: clamp(1rem, 5vw, 1.5rem);
            color: var(--on-surface-variant);
            font-style: italic;
        }

        /* PROMPT CARDS */
        .prompt-card {
            background: var(--surface-container);
            border: 1px solid var(--outline-variant);
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
            margin-bottom: 40px;
            scroll-margin-top: 30px;
        }

        .prompt-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .prompt-number {
            background: var(--primary);
            color: var(--on-primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .prompt-title {
            font-family: var(--font-headline);
            font-size: 1.5rem;
            font-weight: 700;
            font-style: italic;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 400px;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: 12px;
            color: var(--on-surface);
            padding: 20px;
            font-family: var(--font-label);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .copy-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-button:hover {
            background: var(--primary-fixed);
            transform: scale(1.02);
        }

        .copy-button.copied {
            background: var(--green);
            color: #fff;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 60px 0;
            border-top: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header__title { font-size: 2.2rem; }
            .prompt-card { padding: 20px; }
            .prompt-textarea { min-height: 300px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="stars-md"></div>

    <header class="header">
        <div class="container">
            <h1 class="header__title">Author's Homework</h1>
            <h2 class="header__subtitle">আমি কী কী বলতে চাই?</h2>
        </div>
    </header>

    <div class="container">
        
        <!-- PROMPT 1 -->
        <div class="prompt-card" id="p1">
            <div class="prompt-header">
                <div class="prompt-number">1</div>
                <h2 class="prompt-title">Prompt 1</h2>
            </div>
            <textarea class="prompt-textarea" readonly>আমি কী বলতে চাই?
 → কেন বলতে চাই?
 → এটা বোঝার জন্য আগে কী জানা দরকার? (এটা বোঝার জন্য আগে কি জানা দরকার যেটা পাঠক জানে না? পাঠক কেন তা জানে না?)
 → তারপর কী বোঝা দরকার?
 → কোথায় নতুন ধারণা দরকার? (কোন কোন রুল তাকে অ্যাকসেপ্ট করতে হবে? সেগুলো যে রুল, হাইপোথিসিস নয় এবং কেন সেটা রুল তা তাকে বুঝতে হবে।)
 → কোন যুক্তি কোথায় দাঁড়াচ্ছে?
 → কোন জায়গায় কতটা explanation দরকার?
 → কোথায় একটি complete thought শেষ হচ্ছে?
 → তারপর কোন thought naturally আসছে?
 → এটা বোঝাবো কি দিয়ে? কি করে? </textarea>
            <button class="copy-button" onclick="copyPrompt(this)">Copy Prompt</button>
        </div>

    </div>

    <footer class="footer">
        <div class="container">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </div>
    </footer>

    <script>
        // Copy Prompt Logic
        function copyPrompt(button) {
            const textarea = button.previousElementSibling;
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                const originalText = button.innerHTML;
                button.innerHTML = '&#10003; Copied!';
                button.classList.add('copied');
                
                // Deselect Text
                window.getSelection().removeAllRanges();

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
        }
    </script>

</body>
</html>
