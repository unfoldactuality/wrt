            <textarea class="prompt-textarea" readonly>Review the content provided with this prompt through five complementary editorial lenses.

The purpose of this review is to:

1. Identify genuine problems or meaningful opportunities for improvement.
2. Diagnose what kind of problem each observation represents.
3. Explain why the issue matters.
4. Recommend the direction of change.
5. Check whether the content creates the understanding it needs to create in the reader.
6. Check whether concepts appear in the right conceptual order and with the necessary dependencies.
7. Protect the author's substantive intellectual content.

This is a diagnostic review.

Do not rewrite the content.

Do not create a new version of the content.

Do not introduce a new intellectual direction.

Do not replace the author's ideas with your own.

==================================================

GOVERNING PRINCIPLE

Structure is in service of the content, not content in service of the structure.

The author's substantive content must be protected.

Substantive authorial content may include:

propositions

arguments

explanations

interpretations

conceptual distinctions

principles

reasoning

examples

analogies

observations

insights

conclusions

practical techniques

philosophical or metaphysical claims

Do not remove or dilute substantive content merely for:

brevity

symmetry

neatness

flow

reader convenience

compactness

stylistic consistency

If important content creates a structural problem, first consider whether the structure, sequence, placement, context, explanation, transition, or delivery should change so that the content works properly.

Do not call content unnecessary until its function has been properly considered.

==================================================

INTENDED UNDERSTANDING CHECK

For every important section, ask:

What should the reader understand by the end of this section?

Does the content actually create that understanding?

Does the reader receive enough context?

Is the explanation sufficient?

Is the concept introduced at the right time?

Is the sequence understandable?

Does the reader understand why the idea matters?

Can the reader explain the idea in their own words?

Can the reader explain why it matters within the reasoning?

Can the reader see its relationship with the previous and following ideas?

Can the reader recognize or apply the idea in a new but related situation, when application is part of the intended understanding?

Can the reader distinguish the idea from a nearby but different idea?

Look for understanding gaps caused by:

missing context

insufficient explanation

premature introduction of a concept

late introduction of a necessary concept

wrong sequence

weak transition

unclear distinction

inadequate example

over-compressed explanation

unnecessary conceptual jump

unclear expression

missing implication

missing connection between ideas

Use this rule:

Explain until the necessary understanding is achieved, not until everything the author knows has been said.

Do not recommend expansion merely because more explanation is possible.

Do not recommend shortening merely because an explanation is long.

Judge explanation length by the understanding the reader needs to achieve.

==================================================

CONCEPTUAL DEPENDENCY CHECK

For important concepts, ask:

What does the reader need to know before understanding this?

What concept does this idea depend upon?

Has the prerequisite already been established?

Is the dependent concept being introduced too early?

Is it being introduced too late?

Does the reader have enough context to understand why the concept appears here?

Does the sequence follow the logic of the content?

Does the reader have a natural reason to move from one concept to the next?

If the content is sound but the position is wrong, diagnose it as a structural or content–structure problem rather than a content problem.

==================================================

LENS 1 — SEASONED WRITING EDITOR

Examine the writing for:

vague language

generic statements

clichés

unnecessary repetition

wordiness

imprecision

awkward expression

weak sentences

unclear references

unnecessarily formal language

artificial language

mechanical phrasing

poor rhythm

sentences that obscure rather than clarify meaning

Do not recommend substantive deletion merely to make the writing shorter.

Distinguish between:

language that is difficult because the idea itself is difficult

language that is unnecessarily difficult because of poor expression

==================================================

LENS 2 — FIRST-TIME READER

Read as a reader who has never seen the content before.

Look for:

confusion

re-reading points

missing context

unfamiliar concepts

insufficient explanation

unexpected conceptual jumps

unclear references

writerly assumptions

language that feels unnatural to the reader

places where interest weakens

places where the reader may ask:

“Why am I being told this now?”

“Why does this matter?”

“What does this mean?”

“How did we get here?”

Compare intended understanding with actual reader understanding.

When there is a gap, identify the likely cause.

==================================================

LENS 3 — KNOWLEDGEABLE READER

Read as an informed and intellectually attentive reader.

Look for:

overly basic explanation

obvious statements

predictable reasoning

insufficient intellectual value

weak conceptual distinction

unsupported conceptual leap

places where greater precision is necessary

places where an important distinction has been blurred

places where the reasoning appears thinner than the surrounding argument

Do not remove foundational explanation simply because a knowledgeable reader already knows it.

Ask whether the foundation is necessary for the intended reader and for the reasoning that follows.

==================================================

LENS 4 — “SO WHAT?” LENS

Examine the reader-value of the content.

Ask:

What does this information enable the reader to understand?

What insight does it create?

What changes in the reader's understanding?

Why does this matter within the content?

What is the implication?

What is the practical or intellectual significance?

Does the section merely provide information, or does it create understanding?

Does a claim have an implication that has not been made sufficiently clear?

Does an explanation lead naturally to a meaningful takeaway?

Do not remove content merely because its value is not immediately obvious.

First determine whether it serves as:

foundation

prerequisite

argument support

conceptual clarification

distinction

transition

preparation for a later idea

==================================================

LENS 5 — READER JOURNEY

Examine the movement of the reader through the content.

Look for:

weak opening

unclear orientation

detours

circular movement

unnecessary repetition

abrupt transitions

premature concepts

insufficient preparation

important ideas appearing too late

weak development

sudden conclusions

disconnected endings

missing bridges between ideas

lack of a natural reason for the next idea

Pay particular attention to:

experience → question

question → question

question → need

need → concept

concept → explanation

explanation → implication

concept → concept

section → section

ending → next beginning

Always distinguish between:

content that is genuinely unnecessary

content that is necessary but currently in the wrong place

content that is necessary but insufficiently prepared

content that is necessary but insufficiently explained

==================================================

PROBLEM TYPES

Classify observations primarily as:

Content Problem

The content itself needs clarification, development, distinction, qualification, or improvement.

Structure / Placement / Sequence Problem

The content may be valid and useful, but its position, order, context, grouping, transition, or structural role is causing difficulty.

Content–Structure Interaction Problem

The content and structure interact in a way that creates a problem, but the solution should preserve the substantive content while improving how it is presented, positioned, connected, or explained.

==================================================

OBSERVATION FORMAT

For every meaningful observation, provide:

Priority

Lens

Problem Type

Where

Intended Understanding

Actual Reader Understanding

Problem

Why It Matters

Recommended Direction

Use these priority levels:

P1 — Must Fix

A problem that significantly harms clarity, conceptual understanding, reasoning, reader orientation, reader journey, usefulness, depth, or the intended experience.

P2 — Should Fix

A noticeable weakness that reduces effectiveness but does not damage the core message.

P3 — Nice to Fix

A relatively minor issue involving wording, rhythm, small repetition, stylistic polish, or minor clarity.

Do not inflate minor issues into P1 or P2.

==================================================

REVIEW DISCIPLINE

Do not search for problems merely to produce a longer review.

Do not duplicate the same problem under multiple lenses unless the lenses reveal genuinely different consequences.

Prioritize substantive reader impact.

Do not call important content unnecessary without first understanding its function.

Before recommending removal, consider whether the issue can instead be solved through:

relocation

reordering

better context

better explanation

better hierarchy

stronger transition

better introduction

better distinction

repetition management

Do not sacrifice important content to solve a structural problem.

Do not impose your own intellectual direction.

Do not create new arguments.

Do not introduce new substantive content.

Do not rewrite the content.

If the intended meaning is ambiguous and cannot be established reliably, flag the ambiguity rather than inventing an interpretation.

Before recommending a change, consider whether the relevant content may have an important function later in the manuscript.

==================================================

FINAL DIAGNOSTIC SUMMARY

After completing the five-lens review, provide:

P1 — Must Fix

P2 — Should Fix

P3 — Nice to Fix

Structural / Placement / Sequence Problems

Content–Structure Interaction Problems

Intended Understanding Gaps

Authorial Content at Risk

Reader Journey Issues

Conceptual Dependency / Sequence Issues

Overall Diagnosis

    <script>
        // Multi-line Dynamic Auto-Resize Logic for Textareas
        const tx = document.querySelectorAll(".dynamic-textarea");
        for (let i = 0; i < tx.length; i++) {
            tx[i].setAttribute("style", "height:" + (tx[i].scrollHeight) + "px;overflow-y:hidden;");
            tx[i].addEventListener("input", OnInput, false);
        }

        function OnInput() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        }

        // Copy Prompt Logic
        function copyPrompt(button) {
            const textarea = button.previousElementSibling;
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                const originalText = button.innerHTML;
                button.innerHTML = '&#10003; Copied!';
                button.classList.add('copied');
                
                // Deselect Text
                window.getSelection().removeAllRanges();

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
        }
    </script>
